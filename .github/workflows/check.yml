name: check

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Evaluates every lumide_* derivation + apps + overlay.
      - run: nix flake check --all-systems

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Build the latest Lumide and confirm the wrapper exists; catches upstream
      # archive/format regressions on x86_64-linux.
      - run: nix build .#lumide --print-build-logs
      - run: test -x result/bin/lumide

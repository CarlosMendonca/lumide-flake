name: update

# Regenerate data/lumide.json from the GitHub releases API so new Lumide releases
# become available as packages shortly after upstream publishes them. Runs weekly
# and on demand.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  # Raise the GitHub API rate limit for the updater.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Regenerate version data
        run: nix run .#update

      - name: Sanity-check the flake still evaluates
        run: nix flake check --all-systems

      # Build the latest Lumide against the freshly regenerated data, so a broken
      # refresh fails this job before anything is pushed.
      - name: Build latest Lumide
        run: nix build .#lumide --print-build-logs

      # No PR: push the refreshed data straight to main. Validation above has
      # already passed, and a push by GITHUB_TOKEN doesn't re-trigger check.yml.
      - name: Commit & push data changes
        run: |
          if git diff --quiet -- data/lumide.json; then
            echo "No new Lumide versions; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lumide.json
          git commit -m "data: refresh Lumide versions"
          git push origin HEAD:main
